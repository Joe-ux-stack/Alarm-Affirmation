name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Ubuntu runner image already includes the Android SDK at $ANDROID_HOME.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore dev signing key from secrets (if set)
        env:
          KS_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p keystore
            echo "$KS_B64" | base64 -d > keystore/whynotyou-dev.jks
            echo "Using stable dev key"
          else
            echo "No DEV_KEYSTORE_B64 secret; using throwaway debug key"
          fi

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        env:
          DEV_KEYSTORE_PASS: ${{ secrets.DEV_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || true
          grep -E "^e: |error:|FAILURE|What went wrong|Could not|Unresolved" build.log | head -60 > build-errors.txt || true
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Publish build errors to the apk branch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/errbranch && cd /tmp/errbranch
          git init -q -b build-errors
          git config user.name "github-actions"; git config user.email "actions@github.com"
          cp "$GITHUB_WORKSPACE/build-errors.txt" . 2>/dev/null || echo "no errors captured" > build-errors.txt
          tail -c 200000 "$GITHUB_WORKSPACE/build.log" > build-tail.log 2>/dev/null || true
          git add -A && git commit -q -m "build errors for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-errors

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="WhyNotYou-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$NAME" \
            --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Built from commit ${GITHUB_SHA}. Tap the .apk to download and install."

