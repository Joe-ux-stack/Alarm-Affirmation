name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Ubuntu runner image already includes the Android SDK at $ANDROID_HOME.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore dev signing key from secrets (if set)
        env:
          KS_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p keystore
            echo "$KS_B64" | base64 -d > keystore/whynotyou-dev.jks
            echo "Using stable dev key"
          else
            echo "No DEV_KEYSTORE_B64 secret; using throwaway debug key"
          fi

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        env:
          DEV_KEYSTORE_PASS: ${{ secrets.DEV_KEYSTORE_PASS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="WhyNotYou-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$NAME" \
            --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Built from commit ${GITHUB_SHA}. Tap the .apk to download and install."

      - name: Publish APK as a plain static file (apk branch)
        run: |
          NAME="WhyNotYou-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p /tmp/apkbranch && cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp "$GITHUB_WORKSPACE/$NAME" .
          cp "$GITHUB_WORKSPACE/$NAME" WhyNotYou-latest.apk
          cat > index.html <<HTML
          <!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Why Not You – install</title>
          <body style="font-family:system-ui;background:#0F1320;color:#F2F4F8;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;gap:24px">
          <h1 style="margin:0">Why Not You</h1>
          <p style="color:#9AA3B5;margin:0">Build ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}</p>
          <a href="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apk/${NAME}" style="background:#F5A524;color:#0F1320;padding:18px 32px;border-radius:14px;font-weight:800;font-size:18px;text-decoration:none">Download ${NAME}</a>
          </body>
          HTML
          git add -A
          git commit -q -m "APK build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
        env:
          GH_TOKEN: ${{ github.token }}
