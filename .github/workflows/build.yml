name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Ubuntu runner image already includes the Android SDK at $ANDROID_HOME.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore dev signing key from secrets (if set)
        env:
          KS_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p keystore
            echo "$KS_B64" | base64 -d > keystore/whynotyou-dev.jks
            echo "Using stable dev key"
          else
            echo "No DEV_KEYSTORE_B64 secret; using throwaway debug key"
          fi

      - name: Prepare Kokoro voice bundle (cached)
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/kokoro
          key: kokoro-int8-v1_0-7voices-${{ hashFiles('tools/prepare_kokoro.py') }}

      - name: Fetch sherpa-onnx AAR (arm64 only)
        run: |
          mkdir -p app/libs /tmp/aar
          curl -sSL -o /tmp/sherpa.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.11/sherpa-onnx-1.12.11.aar
          cd /tmp/aar && unzip -q /tmp/sherpa.aar && rm -rf jni/armeabi-v7a jni/x86 jni/x86_64
          zip -q -r "$GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar" .
          ls -la "$GITHUB_WORKSPACE/app/libs/"

      - name: Download and trim Kokoro
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          pip install -q numpy onnx
          curl -sSL -o /tmp/kokoro.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          tar xjf /tmp/kokoro.tar.bz2 -C /tmp
          python3 tools/prepare_kokoro.py /tmp/kokoro-int8-multi-lang-v1_0 app/src/main/assets/kokoro
          du -sh app/src/main/assets/kokoro

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        env:
          DEV_KEYSTORE_PASS: ${{ secrets.DEV_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || true
          grep -E "^e: |error:|FAILURE|What went wrong|Could not|Unresolved" build.log | head -60 > build-errors.txt || true
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Publish build errors to the apk branch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/errbranch && cd /tmp/errbranch
          git init -q -b build-errors
          git config user.name "github-actions"; git config user.email "actions@github.com"
          cp "$GITHUB_WORKSPACE/build-errors.txt" . 2>/dev/null || echo "no errors captured" > build-errors.txt
          tail -c 200000 "$GITHUB_WORKSPACE/build.log" > build-tail.log 2>/dev/null || true
          git add -A && git commit -q -m "build errors for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-errors

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="WhyNotYou-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$NAME" \
            --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Built from commit ${GITHUB_SHA}. Tap the .apk to download and install."

      - name: Publish APK as a plain static file (apk branch)
        run: |
          NAME="WhyNotYou-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p /tmp/apkbranch && cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp "$GITHUB_WORKSPACE/$NAME" .
          cp "$GITHUB_WORKSPACE/$NAME" WhyNotYou-latest.apk
          cat > index.html <<HTML
          <!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Why Not You – install</title>
          <body style="font-family:system-ui;background:#0F1320;color:#F2F4F8;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;gap:24px">
          <h1 style="margin:0">Why Not You</h1>
          <p style="color:#9AA3B5;margin:0">Build ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}</p>
          <a href="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apk/${NAME}" style="background:#F5A524;color:#0F1320;padding:18px 32px;border-radius:14px;font-weight:800;font-size:18px;text-decoration:none">Download ${NAME}</a>
          </body>
          HTML
          git add -A
          git commit -q -m "APK build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
        env:
          GH_TOKEN: ${{ github.token }}
