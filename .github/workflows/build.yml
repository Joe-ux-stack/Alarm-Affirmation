name: Build APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Ubuntu runner image already includes the Android SDK at $ANDROID_HOME.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore dev signing key from secrets (if set)
        env:
          KS_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p keystore
            echo "$KS_B64" | base64 -d > keystore/whynotyou-dev.jks
            echo "Using stable dev key"
          else
            echo "No DEV_KEYSTORE_B64 secret; using throwaway debug key"
          fi

      - name: Cache Kokoro package
        id: kcache
        uses: actions/cache@v4
        with:
          path: kokoro-int8-multi-lang-v1_0
          key: kokoro-int8-multi-lang-v1_0-v1

      - name: Download Kokoro package
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o k.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          tar xjf k.tar.bz2 && rm k.tar.bz2

      - name: Build Kokoro asset bundle (voices, lexicon, testers — no model)
        run: |
          pip install -q numpy onnxruntime
          python3 -u tools/prepare_kokoro.py kokoro-int8-multi-lang-v1_0 app/src/main/assets/kokoro 2>&1 | tee bundle.log
          test -f app/src/main/assets/kokoro/preview/af_sky.m4a
          du -sh app/src/main/assets/kokoro

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        env:
          DEV_KEYSTORE_PASS: ${{ secrets.DEV_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || true
          grep -E "^e: |error:|FAILURE|What went wrong|Could not|Unresolved" build.log | head -60 > build-errors.txt || true
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Publish build errors to the apk branch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/errbranch && cd /tmp/errbranch
          git init -q -b build-errors
          git config user.name "github-actions"; git config user.email "actions@github.com"
          cp "$GITHUB_WORKSPACE/build-errors.txt" . 2>/dev/null || echo "no errors captured" > build-errors.txt
          cp "$GITHUB_WORKSPACE/bundle.log" . 2>/dev/null || true
          tail -c 200000 "$GITHUB_WORKSPACE/build.log" > build-tail.log 2>/dev/null || true
          git add -A && git commit -q -m "build errors for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-errors

      - name: Publish release ("latest" on main, "beta" on other branches)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest; [ "${GITHUB_REF_NAME}" = "main" ] || TAG=beta
          NAME="WhyNotYou-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$NAME" --target "${GITHUB_SHA}" \
            --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Built from commit ${GITHUB_SHA}. Tap the .apk to download and install."

