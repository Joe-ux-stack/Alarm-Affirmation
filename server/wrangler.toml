# Why Not You — accounts, purchase checks, sync and the AI connection (MCP).
# Deploy: see README.md. Secrets are set with `wrangler secret put`, never in this file.
name = "whynotyou"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Served at https://mcp.whynotyou.app (add the custom domain in the Cloudflare dashboard).
routes = [{ pattern = "mcp.whynotyou.app", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "whynotyou"
database_id = "REPLACE_WITH_D1_ID"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_KV_ID"

[vars]
PUBLIC_URL = "https://mcp.whynotyou.app"
PACKAGE_NAME = "com.whynotyou.alarm"
# GOOGLE_CLIENT_ID (web client, for "Continue with Google" in the browser and on the phone)
GOOGLE_CLIENT_ID = "REPLACE_WITH_WEB_CLIENT_ID.apps.googleusercontent.com"

# Secrets (wrangler secret put …):
#   GOOGLE_CLIENT_SECRET         web OAuth client secret
#   PLAY_SERVICE_ACCOUNT_JSON    service account key JSON with Play Console "View financial data" access
#   RTDN_SECRET                  random string appended to the Pub/Sub push URL (?k=…)
